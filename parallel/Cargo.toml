[package]
name = "sleuth-parallel"
version = "0.1.0"
edition = "2024"
description = "Runs one Sleuth worker per core with a shared, curated corpus, and serves the dashboard"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1
